<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <title>Scene test — เมืองมอร็อค</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    html, body { height: 100%; margin: 0; background: #0b0f17; color: #e6ecf5; font-family: "Noto Sans Thai", system-ui, sans-serif; }
    #stage { position: absolute; inset: 0 0 48px 0; }
    canvas { width: 100%; height: 100%; display: block; }
    #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 48px; display: flex; gap: 6px; align-items: center; padding: 0 10px; background: #0f1522; border-top: 1px solid #243049; overflow-x: auto; }
    button { padding: 6px 10px; border-radius: 8px; border: 1px solid #243049; background: #1b2539; color: #e6ecf5; cursor: pointer; white-space: nowrap; font-family: inherit; }
    #out { margin-left: auto; color: #8b97ad; font-size: 12px; }
  </style>
</head>
<body>
  <div id="stage"><canvas id="floor"></canvas></div>
  <div id="bar">
    <button data-act="assign">assign</button>
    <button data-act="handoff">handoff</button>
    <button data-act="return">return</button>
    <button data-act="bless">bless</button>
    <button data-act="fail">fail</button>
    <button data-act="angry">angry</button>
    <button data-act="pause">pause/resume</button>
    <button data-act="burst">LEVEL UP</button>
    <button data-act="auto">auto: on</button>
    <span id="out">คลิกตัวละครเพื่อทดสอบ onClick</span>
  </div>
  <script type="module">
    import { createScene } from "./scene.js";
    const TEAM = [
      { id: "captain", name: "Lord Knight", nick: "กัปตัน", role: "captain", roleLabel: "กัปตัน (ผู้ประสานงาน)", color: "#f5b942", jobId: "lord-knight" },
      { id: "res-1", name: "Sniper", nick: "ริน", role: "researcher", roleLabel: "นักวิจัย", color: "#4fa3ff", jobId: "sniper" },
      { id: "res-2", name: "Stalker", nick: "ต้น", role: "researcher", roleLabel: "นักวิจัย", color: "#4fa3ff", jobId: "stalker" },
      { id: "ana-1", name: "High Wizard", nick: "เอิร์ธ", role: "analyst", roleLabel: "นักวิเคราะห์", color: "#9b7dff", jobId: "high-wizard" },
      { id: "wri-1", name: "Professor", nick: "ฟ้า", role: "writer", roleLabel: "นักเขียน", color: "#ff7eb6", jobId: "professor" },
      { id: "dev-1", name: "Whitesmith", nick: "โค้ด", role: "coder", roleLabel: "นักพัฒนา", color: "#3dd598", jobId: "whitesmith" },
      { id: "qa-1", name: "High Priest", nick: "ครูแก้ว", role: "reviewer", roleLabel: "ผู้ตรวจสอบ (QA)", color: "#ffa552", jobId: "high-priest" },
    ];
    const S = { agents: new Map(), tasks: new Map(), totals: { queued: 2 } };
    for (const a of TEAM) S.agents.set(a.id, { ...a, status: "idle", currentTaskId: null, phase: "", computed: { utilization: Math.random() * 0.8 } });
    const canvas = document.getElementById("floor");
    const out = document.getElementById("out");
    const scene = createScene(canvas, S, { onClick: (id) => { out.textContent = `คลิก: ${id ?? "(ว่าง)"}`; console.log("click", id); } });
    scene.ready.then(() => { out.textContent = "สไปรต์โหลดแล้ว"; scene.layout(); });

    const workers = TEAM.filter((a) => a.role !== "captain").map((a) => a.id);
    const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
    const PH = ["กำลังค้นหาแหล่งข้อมูล (Falcon Eyes)", "กำลังเขียนโค้ด (Mammonite)", "กำลังตรวจตามเกณฑ์ (Assumptio)", "กำลังร่างเนื้อหา (Double Casting)"];
    function startWork(id) {
      const a = S.agents.get(id); if (!a || a.status !== "idle") return;
      const t = { id: `t${Date.now()}`, title: pick(["ค้นข้อมูลพื้นฐาน: dashboard ยอดขาย", "วิเคราะห์และสรุป insight", "สร้างต้นแบบ (prototype)", "ตรวจคุณภาพเอกสาร"]), progress: 0, phase: pick(PH) };
      S.tasks.set(t.id, t); a.status = "working"; a.currentTaskId = t.id; a.phase = t.phase;
      scene.spawnPacket("captain", id, t.title.slice(0, 24), a.color, "assign");
      const iv = setInterval(() => {
        t.progress = Math.min(1, t.progress + 0.03);
        if (Math.random() < 0.08) { t.phase = pick(PH); a.phase = t.phase; }
        if (t.progress >= 1) { clearInterval(iv); a.status = "idle"; a.currentTaskId = null; a.phase = ""; scene.spawnPacket(id, "captain", "ส่งผลงาน ✓", a.color, "return"); scene.emote(id, "heart"); if (Math.random() < 0.5) setTimeout(() => scene.fx(id, "bless"), 1200); }
      }, 250);
    }
    const acts = {
      assign: () => startWork(pick(workers.filter((w) => S.agents.get(w).status === "idle")) || workers[0]),
      handoff: () => { const [f, t] = [pick(workers), pick(workers)]; if (f !== t) { scene.emote(f, "angry"); scene.spawnPacket(f, t, "ทำใหม่ตาม feedback", S.agents.get(t).color, "handoff"); } },
      return: () => scene.spawnPacket(pick(workers), "captain", "ส่งผลงาน ✓", "#3dd598", "return"),
      bless: () => scene.fx(pick(workers), "bless"),
      fail: () => { const w = pick(workers); scene.fx(w, "fail"); scene.emote(w, "question"); },
      angry: () => scene.emote("qa-1", "angry"),
      pause: () => { const a = S.agents.get("res-1"); a.status = a.status === "paused" ? "idle" : "paused"; },
      burst: () => scene.burst("captain"),
    };
    let auto = true;
    document.getElementById("bar").addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.act === "auto") { auto = !auto; b.textContent = `auto: ${auto ? "on" : "off"}`; return; }
      acts[b.dataset.act]?.();
    });
    // กัปตันวางแผนเป็นช่วง ๆ
    setInterval(() => {
      if (!auto) return;
      const cap = S.agents.get("captain");
      if (cap.status === "idle" && Math.random() < 0.3) { cap.status = "working"; cap.phase = "กำลังแตกงานย่อย (Aura Blade)"; cap.currentTaskId = null; setTimeout(() => { cap.status = "idle"; cap.phase = ""; }, 2500); }
      const r = Math.random();
      if (r < 0.5) acts.assign(); else if (r < 0.65) acts.handoff(); else if (r < 0.8) acts.bless(); else if (r < 0.9) acts.fail(); else acts.burst();
    }, 2600);
  </script>
</body>
</html>
