<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ออฟฟิศทีม AI 3 มิติ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script>
// URL options (used when the page is embedded in the dashboard): ?embed=1 hides the standalone chrome, ?theme=dark|light forces a theme
(function(){ const q=new URLSearchParams(location.search), th=q.get('theme'), de=document.documentElement;
  if(th==='dark'||th==='light') de.dataset.theme=th; if(q.get('embed')==='1') de.dataset.embed='1'; })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: full-bleed 3D canvas, floating control card (top-left), clock (top-right) */
:root{
  --bg:#dfe3e8; --panel:#ffffffe0; --fg:#1d2430; --muted:#5d6878; --line:#d3d9e1;
  --accent:#2f6fde; --work:#2f6fde; --meet:#d9822b; --coffee:#9b6a48; --print:#2b9a76; --walk:#8b94a3; --lounge:#b0568f; --phone:#b8941f; --rest:#5aa9a0; --visit:#c2603a;
  --sans:"IBM Plex Sans Thai",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141922; --panel:#1b212be6; --fg:#e7ebf1; --muted:#9aa5b5; --line:#2c3542; --accent:#6a9cf5; --walk:#7b8596; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141922; --panel:#1b212be6; --fg:#e7ebf1; --muted:#9aa5b5; --line:#2c3542; --accent:#6a9cf5; --walk:#7b8596; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.card{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));
  width:min(300px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;gap:10px}
h1{margin:0;font-size:17px;font-weight:600;text-wrap:balance}
.sub{margin:0;color:var(--muted);font-size:12.5px;line-height:1.5}
.legend{display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-size:13px}
.legend span:nth-child(even){font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px}
.row{display:flex;gap:6px;flex-wrap:wrap}
button{font:500 12.5px var(--sans);color:var(--fg);background:transparent;border:1px solid var(--line);
  border-radius:8px;padding:6px 10px;cursor:pointer}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.clock{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-family:var(--mono);font-size:15px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.clock small{display:block;font-family:var(--sans);font-size:11px;color:var(--muted)}
.clock .mode{display:flex;margin-top:4px}
.hint{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:12px;color:var(--muted);pointer-events:none;padding-inline:16px}
#tags{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;display:grid;justify-items:center;gap:1px;white-space:nowrap;will-change:transform;
  font-family:var(--sans);text-shadow:0 0 3px #000,0 1px 2px #000,0 0 1px #000}
.tag b{font-size:13px;font-weight:600;color:#fff;line-height:1.1}
.tag .role{font-size:11px;color:#ffd46b;line-height:1.15}
.tag .barrow{display:flex;align-items:center;gap:5px;margin-top:2px}
.tag .bar{width:64px;height:6px;border-radius:1px;background:#1d2430;border:1px solid #0b0e13;box-shadow:0 0 0 1px #6b7280 inset;overflow:hidden}
.tag .bar i{display:block;height:100%;width:0;background:#3fd1a8}
.tag .st{font-size:10.5px;color:#e7ebf1}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-size:14px;color:var(--muted);pointer-events:none}
.info{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(76px + env(safe-area-inset-top,0px));
  width:min(250px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;gap:6px;font-size:13px}
.info-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.info-head strong{font-size:16px}
.info-head button{padding:3px 9px}
.meta{color:var(--muted);font-size:12.5px;line-height:1.45}
.state-pill{display:inline-flex;align-items:center;gap:7px;font-weight:500}
@media (max-width:560px){.info{top:auto;bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
@media (max-width:560px){.card{padding:10px 12px;gap:8px}.sub{display:none}.clock{top:auto;bottom:calc(34px + env(safe-area-inset-bottom,0px))}}
.mode{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.mode i{width:8px;height:8px;border-radius:50%;background:#8b94a3}
.mode[data-state="live"] i{background:#3fd1a8}
.mode[data-state="reconnecting"] i{background:#e0a030}
.tag .task{font-size:10.5px;color:#cfe6ff;max-width:180px;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.tag .bubble{font-size:11px;color:#1d2430;background:#fff;border-radius:8px;padding:2px 7px;margin-bottom:2px;text-shadow:none;box-shadow:0 1px 3px #0005}
html,body{margin:0}
[hidden]{display:none !important} /* .info/#loading set display:grid, so the hidden attribute needs to win */
/* Embedded in the dashboard (?embed=1): the dashboard shows connection/details itself, so keep only the scene + name tags */
:root[data-embed="1"] .clock, :root[data-embed="1"] .info, :root[data-embed="1"] .hint{display:none}
:root[data-embed="1"] #loading{font-size:13px}
</style>
</head>
<body>

<div id="stage"></div>
<div id="tags" aria-hidden="true"></div>
<div id="loading">กำลังจัดออฟฟิศ…</div>


<div class="clock"><small id="clock-label">เวลาในออฟฟิศ</small><span id="clock">09:00</span><span class="mode" id="mode" data-state="demo"><i></i><span id="mode-text">โหมดสาธิต</span></span></div>
<section class="info" id="info" hidden aria-live="polite">
  <div class="info-head"><strong id="i-name"></strong><button id="i-close">ปิด</button></div>
  <div class="meta" id="i-role"></div>
  <div class="state-pill"><i class="dot" id="i-dot"></i><span id="i-state"></span></div>
  <div class="meta" id="i-task"></div>
  <div class="meta" id="i-stats"></div>
</section>
<div class="hint">ลากเพื่อหมุน · เลื่อนหรือบีบเพื่อซูม · แตะพนักงานเพื่อดูข้อมูล</div>

<!-- three.js r128 (vendored, works offline) -->
<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="vendor/GLTFLoader.js"></script>
<script src="vendor/SkeletonUtils.js"></script>
<!-- 1) settings: team, desks, models, behaviour  2) the 3D scene + Office3D API  3) link to the Grock Agent server -->
<script src="config.js"></script>
<script src="office3d.js"></script>
<script src="bridge.js"></script>
</body>
</html>
